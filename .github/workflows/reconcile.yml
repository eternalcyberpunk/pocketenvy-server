name: Reconcile renders and expire storage

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile jobs and purge expired objects
        env:
          API_BASE_URL: ${{ secrets.POCKETENVY_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.POCKETENVY_CRON_SECRET }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/cron/reconcile"
